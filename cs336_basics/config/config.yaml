data:
  data_dir: /home/fredkeira/projects/assignment1-basics/token_to_id_outputs

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000

optim:
  lr_max: 1e-4
  lr_min: 1e-5
  warmup_steps: 30000
  cosine_steps: 100000
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1

train:
  batch_size: 32
  max_steps: 100000
  seed: 1337
  max_l2_norm: 1.0
  save_every: 500
  eval_every: 100
  eval_steps: 20

runtime:
  device: cuda:1
  dtype: float32

experiment:
  run_dir: /home/fredkeira/data/cs336_training_result
  exp_name: tinystories_base
  resume: false
